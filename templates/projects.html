<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Project & Skills Portal</title>

<style>
body{
    font-family: 'Segoe UI', Arial, sans-serif;
    background: linear-gradient(135deg, #1e88e5, #42a5f5);
    margin:0;
    padding:0;
}

.container{
    width:65%;
    margin:40px auto;
    background:white;
    padding:35px;
    border-radius:16px;
    box-shadow:0 10px 30px rgba(0,0,0,0.25);
}

h1{
    text-align:center;
    color:#0d47a1;
    margin-bottom:25px;
}

.section{
    margin-top:25px;
    padding:25px;
    border-radius:14px;
    background:#f5f9ff;
    border:1px solid #dbeafe;
    transition:0.3s;
}

.section:hover{
    transform: scale(1.01);
}

label{
    font-weight:600;
    color:#1e3a8a;
}

input, textarea, select{
    width:100%;
    padding:12px;
    margin-top:6px;
    margin-bottom:14px;
    border-radius:10px;
    border:1px solid #cbd5e1;
    outline:none;
}

input:focus, textarea:focus, select:focus{
    border-color:#2563eb;
    box-shadow:0 0 6px rgba(37,99,235,0.3);
}

textarea{ resize:none; }

button{
    width:100%;
    padding:14px;
    background:linear-gradient(90deg,#2563eb,#1d4ed8);
    color:white;
    border:none;
    border-radius:10px;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    background:linear-gradient(90deg,#1d4ed8,#1e40af);
}

.links{
    text-align:center;
    margin-top:25px;
}

.links a{
    margin:10px;
    text-decoration:none;
    color:#1e3a8a;
    font-weight:bold;
}

.preview{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    margin-top:10px;
}

.preview img{
    width:90px;
    height:90px;
    object-fit:cover;
    border-radius:10px;
    border:2px solid #93c5fd;
}
</style>

<script>
function previewImages(){
    const preview = document.getElementById('preview');
    preview.innerHTML = "";

    const files = document.getElementById('file').files;

    for(let i=0; i<files.length; i++){
        const reader = new FileReader();

        reader.onload = function(e){
            const img = document.createElement("img");
            img.src = e.target.result;
            preview.appendChild(img);
        }

        reader.readAsDataURL(files[i]);
    }
}
</script>

</head>

<body>

<div class="container">

<h1>📂 Project & Skills Management Portal</h1>

<!-- ================= PROJECT UPLOAD ================= -->
<div class="section">
    <h2>📤 Upload Project</h2>

    <form action="{{ url_for('projects') }}" method="POST" enctype="multipart/form-data">

        <label>Project Title</label>
        <input type="text" name="title" required>

        <label>Description</label>
        <textarea name="description" rows="4" required></textarea>

        <label>Upload Images</label>
        <input type="file" name="files" id="file" multiple accept="image/*" onchange="previewImages()">

        <div id="preview" class="preview"></div>

        <label>Email</label>
        <input type="email" name="email" required>

        <label>Phone</label>
        <input type="text" name="phone" required placeholder="07XXXXXXXX">

        <label>WhatsApp</label>
        <input type="text" name="whatsapp" placeholder="2547XXXXXXXX">

        <button type="submit">🚀 Submit Project</button>

    </form>
</div>

<!-- ================= SKILLS ================= -->
<div class="section">
    <h2>🏆 Skills Competition Entry</h2>

    <!-- FIXED: endpoint changed from skills → add_skill -->
    <form action="{{ url_for('skills') }}" method="POST">

        <label>Student Name</label>
        <input type="text" name="name" required>

        <label>Class</label>
        <input type="text" name="class" required>

        <label>Department</label>
        <input type="text" name="department" required>

        <label>Area of Competition</label>
        <select name="area" required>
            <option value="">Select Area</option>
            <option>Web Development</option>
            <option>Mobile App Development</option>
            <option>Electrical Engineering</option>
            <option>Mechanical Engineering</option>
            <option>Graphic Design</option>
            <option>Networking</option>
        </select>

        <label>Supervisor</label>
        <input type="text" name="supervisor" required>

        <button type="submit">🏅 Submit Entry</button>

    </form>
</div>

<!-- ================= NAVIGATION ================= -->
<div class="links">
    <a href="{{ url_for('uploads') }}">📂 View Uploads</a>
    <a href="{{ url_for('dashboard') }}">⬅ Back to Dashboard</a>
</div>

</div>

</body>
</html>
