<!DOCTYPE html>
<html>
<head><title>Login</title></head>
<body>

    <style>
body{
    font-family:Arial;
    background:#1e88e5;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.card{
    background:white;
    padding:30px;
    border-radius:12px;
    box-shadow:0 5px 15px rgba(0,0,0,0.1);
    width:300px;
}

h2{text-align:center;color:#1e3a8a;}

input{
    width:100%;
    padding:10px;
    margin:10px 0;
    border-radius:6px;
    border:1px solid #ccc;
}

button{
    width:100%;
    padding:10px;
    background:#2563eb;
    color:white;
    border:none;
    border-radius:6px;
}

a{
    display:block;
    text-align:center;
    margin-top:10px;
}
</style>
<h2>Login</h2>
<form method="POST">
    <input type="email" name="email" placeholder="Email" required><br><br>
    <input type="password" name="password" placeholder="Password" required><br><br>
    <button type="submit">Login</button>
</form>
<p>Not registered? <a href="/register">Register here</a></p>
</body>
</html>
